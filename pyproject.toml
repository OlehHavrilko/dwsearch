[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dwsearch"
version = "0.0.0"
description = "Deep web search + web UI"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
dwsearch = "dwsearch_web:main"

[tool.setuptools]
packages = ["dwsearch", "dwsearch_web", "banner", "headers"]
include-package-data = true

[tool.setuptools.package-data]
dwsearch_web = ["templates/*.html"]
