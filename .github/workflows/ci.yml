name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt
      - name: Smoke import
        run: |
          python -c "import dwsearch"
          python -c "import dwsearch_web"
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
