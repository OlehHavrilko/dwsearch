name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r darkdump-web/requirements.txt
      - name: Smoke import
        run: |
          python -c "import darkdump"
          python -c "import importlib; importlib.import_module('darkdump-web.app'.replace('-', '_'))" || true

